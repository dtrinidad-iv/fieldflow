name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (a moved or compromised tag can't change what runs).
# Update a pin by resolving the new tag: git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: scripts/scan-secrets.sh
      - name: Lint
        run: npm run lint
      - name: Tests with coverage
        run: npm run test:coverage
      - name: npm audit
        run: npm audit --audit-level=high
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        if: hashFiles('template.yaml') != ''
        with:
          use-installer: true
      - name: sam validate
        if: hashFiles('template.yaml') != ''
        run: sam validate --lint
      # Builds every function the way a deploy would (esbuild bundles), so a broken build
      # shows up here instead of during safe-deploy.
      - name: sam build
        if: hashFiles('template.yaml') != ''
        run: sam build
